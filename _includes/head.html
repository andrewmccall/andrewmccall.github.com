<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign page_title = page.title | default: site.title %}
  {% assign page_description = page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines %}
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page_description | truncate: 160 | escape }}">
  <meta name="author" content="{{ site.author.name }}">
  <meta name="theme-color" content="#101312">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page_title | escape }}">
  <meta property="og:description" content="{{ page_description | truncate: 160 | escape }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/icons/favicon.ico' | relative_url }}" sizes="any">
  <link rel="stylesheet" href="{{ '/css/main.css?v=2' | relative_url }}">
</head>
