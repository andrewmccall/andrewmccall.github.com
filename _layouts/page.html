---
layout: default
---
<article class="page-shell">
  <header class="page-heading">
    <p class="prompt">$ {{ page.prompt | default: page.title | downcase }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p class="page-intro">{{ page.intro }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
