---
layout: page
---
<div class="entry-list">
  {% for post in page.posts %}
  <a class="entry-row" href="{{ post.url | relative_url }}">
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%d.%m.%Y" }}</time>
    <strong>{{ post.title }}</strong>
  </a>
  {% endfor %}
</div>
