# Minimal Mistakes Configuration
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "air"

# Site Settings
locale: "en-GB"
title: "Andrew McCall"
title_separator: "-"
subtitle: "Data · Engineering · Leadership"
name: "Andrew McCall"
description: >-
  Thoughts on data engineering, platform engineering, and building things.
  Interim Executive Director at Lloyds Banking Group.
url: "https://andrewmccall.com"
baseurl: ""
repository: "andrewmccall/andrewmccall.github.io"

# SEO
twitter:
  username: andrewmccall
social:
  name: Andrew McCall
  links:
    - https://www.linkedin.com/in/drewmccall
    - https://github.com/andrewmccall

# Google Analytics
google_analytics: UA-52254722-1

# Comments
comments:
  provider: disqus
  disqus:
    shortname: andrewmccall

# Footer
footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/drewmccall"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/andrewmccall"

# Reading
words_per_minute: 200

# Pagination
paginate: 10
paginate_path: /page:num/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
      comments: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

# Collections
collections:
  pages:
    output: true
    permalink: /:path/

# Category / Tag
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# Build
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Sass
sass:
  style: compressed

# Exclude
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
